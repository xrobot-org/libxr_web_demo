name: Deploy WebAssembly to GitHub Pages

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show the LibXR revision
        run: |
          git config --global --add safe.directory '*'
          git submodule status
          emcc --version | head -n 1

      - name: Build with emcmake/emmake
        run: |
          mkdir -p build
          cd build
          emcmake cmake ..
          emmake make

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Compatibility canary: builds against the head of the LibXR master branch.
  # A failure here is reported but does not fail the workflow.
  libxr-master:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: emscripten/emsdk:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update LibXR to master
        run: |
          git config --global --add safe.directory '*'
          git -C libxr fetch --depth 1 origin master
          git -C libxr checkout --detach FETCH_HEAD
          git -C libxr log -1 --format='LibXR master: %H %s'

      - name: Build with emcmake/emmake
        run: |
          mkdir -p build
          cd build
          emcmake cmake ..
          emmake make
